aid: dedalus
name: Dedalus
description: >-
  Dedalus Group is a European healthcare and diagnostics software provider headquartered in
  Florence, Italy, supplying clinical information systems, electronic patient records, laboratory
  and diagnostic imaging software to hospitals, laboratories and care networks across roughly 40
  countries. Its product estate includes the ORBIS and ORBIS U electronic patient record suites,
  the Lorenzo EPR in the UK, X1.V1 in Italy, and DC4H (Digital Connect 4 Health) / Open Health
  Connect, an HL7 FHIR-based interoperability and longitudinal-patient-record platform the company
  markets under an "API economy" model. Dedalus states that DC4H exposes an FHIR API management
  component that third-party developers can build against, and the company participates in the
  openEHR community, but as of this profiling pass it publishes no public developer portal, no API
  reference, no OpenAPI or FHIR CapabilityStatement, and no sandbox on any dedalus.com host —
  integration access runs through a sales and customer-support motion rather than a self-serve
  developer surface.
